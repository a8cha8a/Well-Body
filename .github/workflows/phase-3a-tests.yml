name: Phase 3A tests

on:
  push:
    branches: ["main", "phase-3a-test-foundation"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build and validate MEXT Food Master
        run: npm run build
      - name: Run regression tests
        run: npm test
      - name: Install Chromium for isolated PWA tests
        run: npx playwright install --with-deps chromium
      - name: Run real Service Worker browser tests
        run: npm run test:pwa-browser
